<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passhand logins</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
      --accent: #2f5bd3; --danger: #b3261e; --ok: #1e7b3a; --field: #ffffff;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618; --card: #1f1f22; --text: #ececee; --muted: #9a9aa2; --line: #333338;
        --accent: #7d9cff; --danger: #ff8a80; --ok: #7fd49a; --field: #2a2a2e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
    label.wide, .actions { grid-column: 1 / -1; }
    input[type=text], input[type=password] { font: inherit; color: var(--text); background: var(--field);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
    label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { font: inherit; border-radius: 8px; padding: 7px 14px; cursor: pointer;
      border: 1px solid var(--line); background: var(--field); color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button:disabled, input:disabled { opacity: .55; cursor: default; }
    .hint { font-size: 13px; color: var(--muted); }
    #status { min-height: 1.5em; margin: 0 0 16px; }
    #status.error { color: var(--danger); }
    #status.ok { color: var(--ok); }
    .site { border-top: 1px solid var(--line); padding: 14px 0; }
    .site:first-of-type { border-top: 0; padding-top: 0; }
    .site-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
    .origin { font-weight: 600; word-break: break-all; }
    .account { display: flex; align-items: center; gap: 12px; padding: 6px 0; flex-wrap: wrap; }
    .account .user { flex: 1 1 200px; word-break: break-all; }
    .empty { color: var(--muted); }
    @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Passhand logins</h1>
    <p class="lead">AI agents can only sign in to the sites and accounts listed here. Every change asks for
      Touch ID on your Mac, and saved passwords are never shown again.</p>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="card">
      <h2>Add a login</h2>
      <form id="add" autocomplete="off">
        <label class="wide">Site
          <input type="text" name="site" placeholder="https://example.com" required spellcheck="false" autocapitalize="off">
        </label>
        <label>Username
          <input type="text" name="username" required spellcheck="false" autocapitalize="off">
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="new-password">
        </label>
        <label class="check wide">
          <input type="checkbox" name="auto"> Fill without Touch ID (auto). Use this for test accounts only.
        </label>
        <div class="actions">
          <button type="submit" class="primary">Save login</button>
          <span class="hint">Saving a site and username that already exist replaces the password.</span>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Saved logins</h2>
      <div id="logins"><p class="empty">Loading…</p></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
