name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helper:
    name: Build helper (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path helper
      - run: ./helper/.build/release/passhand help

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check extension/background.js
      - run: npm install
        working-directory: tests
      - run: npm test
        working-directory: tests

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && bash -n uninstall.sh
